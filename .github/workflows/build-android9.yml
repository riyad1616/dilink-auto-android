"PhoneSender/src/main/java/com/geelymirror/phone/MainActivity.kt": """package com.geelymirror.phone
import android.app.Activity
import android.content.Context
import android.content.Intent
import android.media.projection.MediaProjectionManager
import android.os.Build
import android.os.Bundle
import android.widget.Button
import android.widget.EditText
import android.widget.Toast
import androidx.appcompat.app.AppCompatActivity
class MainActivity : AppCompatActivity() {
    private val REQ_CODE = 1001
    private lateinit var manager: MediaProjectionManager
    override fun onCreate(s: Bundle?) {
        super.onCreate(s)
        setContentView(R.layout.activity_main)
        manager = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
        findViewById<Button>(R.id.btnStart).setOnClickListener {
            val ip = findViewById<EditText>(R.id.editIp).text.toString().trim()
            if(ip.isEmpty()){ Toast.makeText(this,"ادخل IP السيارة",0).show(); return@setOnClickListener }
            getSharedPreferences("prefs", MODE_PRIVATE).edit().putString("car_ip", ip).apply()
            startActivityForResult(manager.createScreenCaptureIntent(), REQ_CODE)
        }
    }
    override fun onActivityResult(c:Int, r:Int, d:Intent?){
        super.onActivityResult(c,r,d)
        if(c==REQ_CODE && r==Activity.RESULT_OK && d!=null){
            val i = Intent(this, ScreenCaptureService::class.java).apply{ putExtra("code",r); putExtra("data",d) }
            if(Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(i) else startService(i)
        }
    }
}
""",

"PhoneSender/src/main/java/com/geelymirror/phone/ScreenCaptureService.kt": """package com.geelymirror.phone
import android.app.Notification
import android.app.NotificationChannel
import android.app.NotificationManager
import android.app.Service
import android.content.Context
import android.content.Intent
import android.hardware.display.DisplayManager
import android.hardware.display.VirtualDisplay
import android.media.MediaCodec
import android.media.MediaCodecInfo
import android.media.MediaFormat
import android.media.projection.MediaProjection
import android.media.projection.MediaProjectionManager
import android.os.Build
import android.os.IBinder
import java.io.DataOutputStream
import java.net.ServerSocket
import java.net.Socket
class ScreenCaptureService : Service() {
    private var mediaProjection: MediaProjection? = null
    private var virtualDisplay: VirtualDisplay? = null
    private var encoder: MediaCodec? = null
    override fun onStartCommand(intent: Intent?, f:Int, id:Int): Int {
        createNotification()
        val code = intent!!.getIntExtra("code", -1)
        val data = intent.getParcelableExtra<Intent>("data")!!
        val carIp = getSharedPreferences("prefs", MODE_PRIVATE).getString("car_ip","")!!
        val mgr = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
        mediaProjection = mgr.getMediaProjection(code, data)
        startStreaming(carIp)
        startTouchServer()
        return START_STICKY
    }
    private fun createNotification(){
        val chId = "mirror_channel"
        if(Build.VERSION.SDK_INT >= Build.VERSION_CODES.O){
            val ch = NotificationChannel(chId, "Geely Mirror", NotificationManager.IMPORTANCE_LOW)
            (getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager).createNotificationChannel(ch)
        }
        val notif = if(Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) Notification.Builder(this, chId).setContentTitle("Geely Mirror Pro").setContentText("يتم عكس الشاشة...").setSmallIcon(android.R.drawable.ic_media_play).build()
        else Notification.Builder(this).setContentTitle("Geely Mirror Pro").setContentText("يتم عكس الشاشة...").setSmallIcon(android.R.drawable.ic_media_play).build()
        startForeground(1, notif)
    }
    private fun startStreaming(ip: String){
        Thread{
            try{
                val socket = Socket(ip, 8080)
                val out = DataOutputStream(socket.getOutputStream())
                val format = MediaFormat.createVideoFormat("video/avc", 1280, 720)
                format.setInteger(MediaFormat.KEY_BIT_RATE, 2000000)
                format.setInteger(MediaFormat.KEY_FRAME_RATE, 30)
                format.setInteger(MediaFormat.KEY_I_FRAME_INTERVAL, 1)
                format.setInteger(MediaFormat.KEY_COLOR_FORMAT, MediaCodecInfo.CodecCapabilities.COLOR_FormatSurface)
                encoder = MediaCodec.createEncoderByType("video/avc")
                encoder!!.configure(format, null, null, MediaCodec.CONFIGURE_FLAG_ENCODE)
                val surface = encoder!!.createInputSurface()
                encoder!!.start()
                virtualDisplay = mediaProjection!!.createVirtualDisplay("GeelyMirror",1280,720,240, DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, surface, null, null)
                val info = MediaCodec.BufferInfo()
                while(true){
                    val idx = encoder!!.dequeueOutputBuffer(info, 10000)
                    if(idx >= 0){
                        val buf = encoder!!.getOutputBuffer(idx)!!
                        val arr = ByteArray(info.size)
                        buf.get(arr)
                        out.writeInt(arr.size)
                        out.write(arr)
                        encoder!!.releaseOutputBuffer(idx, false)
                    }
                }
            }catch(e:Exception){ e.printStackTrace() }
        }.start()
    }
    private fun startTouchServer(){
        Thread{
            try{
                val server = ServerSocket(8081)
                while(true){
                    val c = server.accept()
                    val data = c.getInputStream().bufferedReader().readLine() ?: continue
                    val parts = data.split(",")
                    if(parts.size==3){
                        val x = parts[0].toFloat()
                        val y = parts[1].toFloat()
                        val w = resources.displayMetrics.widthPixels
                        val h = resources.displayMetrics.heightPixels
                        TouchInjectService.instance?.click(x*w, y*h)
                    }
                    c.close()
                }
            }catch(e:Exception){}
        }.start()
    }
    override fun onBind(i: Intent?): IBinder? = null
}
""",

"PhoneSender/src/main/java/com/geelymirror/phone/TouchInjectService.kt": """package com.geelymirror.phone
import android.accessibilityservice.AccessibilityService
import android.accessibilityservice.GestureDescription
import android.graphics.Path
import android.view.accessibility.AccessibilityEvent
class TouchInjectService : AccessibilityService() {
    companion object { var instance: TouchInjectService? = null }
    override fun onServiceConnected() { instance = this; super.onServiceConnected() }
    override fun onAccessibilityEvent(e: AccessibilityEvent?) {}
    override fun onInterrupt() {}
    fun click(x: Float, y: Float){
        val path = Path().apply{ moveTo(x, y) }
        val gesture = GestureDescription.Builder().addStroke(GestureDescription.StrokeDescription(path, 0, 100)).build()
        dispatchGesture(gesture, null, null)
    }
}
""",

