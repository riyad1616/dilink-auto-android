    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: \'17\', distribution: \'temurin\' }
      - name: Build Phone APK
        run: |
          cd PhoneSender
          chmod +x gradlew || gradle wrapper
          ./gradlew assembleDebug
      - name: Build Car APK
        run: |
          cd CarReceiver
          chmod +x gradlew || gradle wrapper
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GeelyMirror-APKs
          path: |
            PhoneSender/build/outputs/apk/debug/*.apk
            CarReceiver/build/outputs/apk/debug/*.apk
""",

"build.py": """
import os, subprocess, platform, urllib.request, zipfile
GRADLE_VERSION = "8.4"
def download_gradle():
    if os.path.exists("gradle"): return
    print("⬇️ جاري تحميل Gradle...")
    url = f"https://services.gradle.org/distributions/gradle-{GRADLE_VERSION}-bin.zip"
    urllib.request.urlretrieve(url, "gradle.zip")
    with zipfile.ZipFile("gradle.zip", \'r\') as z: z.extractall(".")
    os.rename(f"gradle-{GRADLE_VERSION}", "gradle")
    os.remove("gradle.zip")
def build():
    download_gradle()
    gradle_cmd = os.path.join("gradle", "bin", "gradle.bat" if platform.system()=="Windows" else "gradle")
    for module in ["PhoneSender", "CarReceiver"]:
        print(f"\\n🔨 جاري بناء {module}...")
        if not os.path.exists(os.path.join(module, "gradlew")):
            subprocess.run([gradle_cmd, "wrapper"], cwd=module, shell=True)
        cmd = "gradlew.bat assembleDebug" if platform.system()=="Windows" else "./gradlew assembleDebug"
        subprocess.run(cmd, cwd=module, shell=True)
        apk_path = os.path.join(module, "build", "outputs", "apk", "debug", "app-debug.apk")
        if not os.path.exists(apk_path):
            apk_path = os.path.join(module, "build", "outputs", "apk", "debug", module+"-debug.apk")
        new_name = f"GeelyMirror-Phone.apk" if module=="PhoneSender" else f"GeelyMirror-Car.apk"
        if os.path.exists(apk_path):
            if os.path.exists(new_name): os.remove(new_name)
            os.rename(apk_path, new_name)
            print(f"✅ تم انشاء: {new_name}")
    print("\\n🎉 انتهى البناء بنجاح!")
if __name__ == "__main__":
    build()
""",
}

def create():
    for path, content in FILES.items():
        full = os.path.join(PROJECT, path)
        os.makedirs(os.path.dirname(full), exist_ok=True)
        open(full, "w", encoding="utf-8").write(content.strip()+"\n")
        print(f"تم انشاء: {full}")
    with zipfile.ZipFile(PROJECT+".zip", \'w\', zipfile.ZIP_DEFLATED) as z:
        for root, _, files in os.walk(PROJECT):
            for file in files:
                full_path = os.path.join(root, file)
                z.write(full_path, os.path.relpath(full_path, "."))
    print(f"\n✅ تم تجهيز المشروع: {PROJECT}.zip")
    print("1- ادخل للمجلد وشغل: python build.py")
    print("2- ستحصل على GeelyMirror-Phone.apk و GeelyMirror-Car.apk")

if __name__ == "__main__":
    create()
