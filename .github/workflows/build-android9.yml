"CarReceiver/src/main/java/com/geelymirror/car/MainActivity.kt": """package com.geelymirror.car
import android.media.MediaCodec
import android.media.MediaFormat
import android.net.wifi.WifiManager
import android.os.Bundle
import android.text.format.Formatter
import android.view.Gravity
import android.view.SurfaceView
import android.widget.LinearLayout
import android.widget.TextView
import androidx.appcompat.app.AppCompatActivity
import java.io.DataInputStream
import java.net.ServerSocket
import java.net.Socket
class MainActivity : AppCompatActivity() {
    lateinit var surfaceView: SurfaceView
    var decoder: MediaCodec? = null
    var phoneIp: String = ""
    override fun onCreate(b: Bundle?) {
        super.onCreate(b)
        val layout = LinearLayout(this).apply{ orientation = LinearLayout.VERTICAL; gravity = Gravity.CENTER }
        val ipText = TextView(this).apply{ textSize = 18f; gravity = Gravity.CENTER; setPadding(20,20,20,20) }
        surfaceView = SurfaceView(this)
        layout.addView(ipText)
        layout.addView(surfaceView, LinearLayout.LayoutParams(-1,-1))
        setContentView(layout)
        val wm = applicationContext.getSystemService(WIFI_SERVICE) as WifiManager
        val ip = Formatter.formatIpAddress(wm.connectionInfo.ipAddress)
        ipText.text = "IP السيارة هو:\\n"+ip+"\\n\\nادخل هذا الرقم في تطبيق الهاتف"
        startServer(ipText)
        surfaceView.setOnTouchListener { _, e ->
            sendTouch(e.x / surfaceView.width, e.y / surfaceView.height, e.action)
            true
        }
    }
    private fun startServer(ipText: TextView){
        Thread{
            try{
                val server = ServerSocket(8080)
                runOnUiThread{ ipText.text = ipText.text.toString() + "\\nجاهز على المنفذ 8080"}
                val client = server.accept()
                phoneIp = client.inetAddress.hostAddress ?: ""
                runOnUiThread{ ipText.text = "متصل بالهاتف: "+phoneIp }
                val input = DataInputStream(client.getInputStream())
                decoder = MediaCodec.createDecoderByType("video/avc")
                val format = MediaFormat.createVideoFormat("video/avc", 1280, 720)
                decoder!!.configure(format, surfaceView.holder.surface, null, 0)
                decoder!!.start()
                val info = MediaCodec.BufferInfo()
                while(true){
                    val len = input.readInt()
                    val data = ByteArray(len)
                    input.readFully(data)
                    val idx = decoder!!.dequeueInputBuffer(10000)
                    if(idx >=0){
                        decoder!!.getInputBuffer(idx)!!.put(data)
                        decoder!!.queueInputBuffer(idx, 0, len, System.nanoTime()/1000, 0)
                    }
                    val outIdx = decoder!!.dequeueOutputBuffer(info, 10000)
                    if(outIdx >=0) decoder!!.releaseOutputBuffer(outIdx, true)
                }
            }catch(e:Exception){ e.printStackTrace() }
        }.start()
    }
    private fun sendTouch(x:Float, y:Float, a:Int){
        Thread{
            try{
                if(phoneIp.isEmpty()) return@Thread
                val s = Socket(phoneIp, 8081)
                s.getOutputStream().write("$x,$y,$a".toByteArray())
                s.close()
            }catch(e:Exception){}
        }.start()
    }
}
""",

".github/workflows/build.yml": """name: Build Geely Mirror APKs
